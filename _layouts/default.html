<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #17202a;
      background: #fff;
      line-height: 1.55;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 24px 56px;
    }

    h1, h2, h3 {
      line-height: 1.2;
    }

    h1, h2 {
      padding-bottom: 10px;
      border-bottom: 1px solid #d9e1ea;
    }

    a {
      color: #245a91;
    }

    code {
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
      background: #f7f9fb;
      padding: 0.12em 0.32em;
      border-radius: 4px;
    }

    pre {
      overflow-x: auto;
      background: #f7f9fb;
      padding: 16px;
      border-radius: 6px;
    }

    pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }

    th, td {
      border: 1px solid #d9e1ea;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f7f9fb;
    }

    blockquote {
      margin: 16px 0;
      padding: 8px 16px;
      color: #5f6b7a;
      border-left: 4px solid #d9e1ea;
      background: #f7f9fb;
    }

    .mermaid {
      margin: 20px 0;
      padding: 16px;
      border: 1px solid #d9e1ea;
      border-radius: 6px;
      background: #fff;
      overflow-x: auto;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'annotation', 'annotation-xml'],
        ignoreHtmlClass: 'tex2jax_ignore|language-.*|mermaid'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main>
    {{ content }}
  </main>

  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

    const looksLikeMermaid = text => /^(flowchart|graph|sequenceDiagram|classDiagram|stateDiagram|erDiagram|journey|gantt|pie|mindmap|timeline)\b/.test(text.trim());

    document.querySelectorAll("pre code").forEach(code => {
      const pre = code.closest("pre");
      const wrapper = code.closest("[class*='language-mermaid']");
      const text = code.textContent || "";

      if (!pre || (!code.classList.contains("language-mermaid") && !wrapper && !looksLikeMermaid(text))) {
        return;
      }

      const diagram = document.createElement("div");
      diagram.className = "mermaid";
      diagram.textContent = text;
      pre.replaceWith(diagram);
    });

    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "strict",
      theme: "default"
    });

    await mermaid.run({ querySelector: ".mermaid" });
  </script>
</body>
</html>
