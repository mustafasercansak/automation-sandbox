name: Bug Report
description: Create a bug report to help fix a problem or unexpected behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much context as possible.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: What is the urgency / impact of this issue?
      options:
        - P0 (Blocker / Critical)
        - P1 (High)
        - P2 (Medium)
        - P3 (Low / Backlog)
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: T-Shirt sizing of the task.
      options:
        - XS (Extra Small - <1h)
        - S (Small - 1h-2h)
        - M (Medium - 2h-4h)
        - L (Large - 1d-2d)
        - XL (Extra Large - >2d)
    validations:
      required: true

  - type: dropdown
    id: iteration
    attributes:
      label: Target Iteration
      description: When should this issue be executed?
      options:
        - Current Iteration (Now)
        - Next Iteration (Next)
        - Future / Backlog
    validations:
      required: true

  - type: input
    id: estimate
    attributes:
      label: Estimated Effort (Est.)
      description: Estimated time to resolve (e.g., 30m, 1h, 4h, 1d).
      placeholder: "1h"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what is broken, unexpected behavior, or error encountered.
      placeholder: |
        Describe the defect clearly. Include any stack traces, logs, or error messages.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Run '...'
        2. Call '...'
        3. See error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen vs what actually happened?
    validations:
      required: false

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance Criteria
      description: Concrete checkboxes defining when this issue is resolved.
      value: |
        - [ ] Root cause identified and resolved.
        - [ ] Regression test added to ScenarioRunner asserting the fix.
        - [ ] Existing test suite passes unmodified.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      multiple: true
      options:
        - Core SelfHealing (SelfHealingResolver / SimilarityScorer)
        - LLM Healing & Providers (Claude / Gemini / OpenAI / Ollama)
        - Intent Automation & Codegen (IntentAutomation / Generators)
        - Web Discovery & Playwright (WebDiscovery / PlaywrightLiveExploration)
        - Desktop Discovery & FlaUI (Discovery / WinForms / WPF)
        - Test Suite & Benchmarks (ScenarioRunner)
        - Build & CI Pipelines (.github/workflows)
