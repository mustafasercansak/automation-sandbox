name: Feature Request / Enhancement
description: Suggest an idea, enhancement, or architectural improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to Automation Sandbox!

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: What is the priority of this enhancement?
      options:
        - P0 (Blocker / Critical)
        - P1 (High)
        - P2 (Medium)
        - P3 (Low / Backlog)
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: T-Shirt sizing of the feature.
      options:
        - XS (Extra Small - <1h)
        - S (Small - 1h-2h)
        - M (Medium - 2h-4h)
        - L (Large - 1d-2d)
        - XL (Extra Large - >2d)
    validations:
      required: true

  - type: dropdown
    id: iteration
    attributes:
      label: Target Iteration
      description: When should this feature be implemented?
      options:
        - Current Iteration (Now)
        - Next Iteration (Next)
        - Future / Backlog
    validations:
      required: true

  - type: input
    id: estimate
    attributes:
      label: Estimated Effort (Est.)
      description: Estimated time to implement (e.g., 30m, 1h, 4h, 1d, 2d).
      placeholder: "2h"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Problem / Motivation
      description: What problem does this solve, or what capability does it add?
      placeholder: |
        Describe why this enhancement is needed or beneficial.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / Design
      description: How should this be implemented or architected?
      placeholder: |
        Outline the proposed API changes, design, or workflow.
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance Criteria
      description: Concrete checkboxes defining when this feature is completed.
      value: |
        - [ ] Feature implemented according to proposed design.
        - [ ] Automated tests added in ScenarioRunner.
        - [ ] Documentation updated in docs/ or README.md if applicable.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Target Component
      multiple: true
      options:
        - Core SelfHealing (SelfHealingResolver / SimilarityScorer)
        - LLM Healing & Providers (Claude / Gemini / OpenAI / Ollama)
        - Intent Automation & Codegen (IntentAutomation / Generators)
        - Web Discovery & Playwright (WebDiscovery / PlaywrightLiveExploration)
        - Desktop Discovery & FlaUI (Discovery / WinForms / WPF)
        - Test Suite & Benchmarks (ScenarioRunner)
        - Build & CI Pipelines (.github/workflows)
