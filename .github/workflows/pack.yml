name: Pack
# Manual trigger only - deliberately separate from ci.yml so ordinary pushes/PRs never
# produce or publish a package. This only packs .nupkg files as a build artifact;
# publishing to nuget.org is owned by the separate release workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to stamp into produced .nupkg files (leave empty to use Directory.Build.props)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  pack:
    runs-on: windows-latest
    # Observed 1m55s-2m25s across recent runs (measured before ContentAnalysis/IntentExecution
    # were added): Release build plus dotnet pack invocations (now 9, was 7) and package validation.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Package Version
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          $version = $env:VERSION_INPUT.Trim()
          # The version is written to GITHUB_ENV and used in a tag name, so it must be a plain version: a line break or a quote in it
          # would add environment variables or break out of a string (#637).
          if ($version -and $version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$') {
            throw "version must look like 1.2.3 or 1.2.3-beta.4, not '$version'."
          }
          if (-not $version) {
            $props = Get-Content Directory.Build.props -Raw
            if ($props -match '<Version>(?<v>[^<]+)</Version>') {
              $version = $Matches['v'].Trim()
            } else {
              throw 'Could not extract <Version> from Directory.Build.props'
            }
          }
          Write-Host "Resolved package version: $version"
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AutomationSandbox.sln

      - name: Build Release
        run: dotnet build AutomationSandbox.sln --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Pack UiModel
        run: dotnet pack TestAutomation/UiModel/UiModel.csproj --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack SelfHealing
        run: dotnet pack TestAutomation/SelfHealing/SelfHealing.csproj --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack LlmHealing
        run: dotnet pack TestAutomation/LlmHealing/LlmHealing.csproj --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack Discovery
        run: dotnet pack TestAutomation/Discovery/Discovery.csproj --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack WebDiscovery
        run: dotnet pack TestAutomation/WebDiscovery/WebDiscovery.csproj --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack IntentAutomation
        run: dotnet pack TestAutomation/IntentAutomation/IntentAutomation.csproj --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack PlaywrightLiveExploration
        run: dotnet pack TestAutomation/PlaywrightLiveExploration/PlaywrightLiveExploration.csproj --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack ContentAnalysis
        run: dotnet pack TestAutomation/ContentAnalysis/ContentAnalysis.csproj --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack IntentExecution
        run: dotnet pack TestAutomation/IntentExecution/IntentExecution.csproj --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      # The dotnet tools (#658) are packed into their own directory: Validate-NuGetPackages.ps1 checks the nine library layouts only.
      - name: Pack the dotnet tools
        run: |
          dotnet pack TestAutomation/SelfHealingCli/SelfHealingCli.csproj --configuration Release --no-build --output ./tool-nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}
          dotnet pack TestAutomation/AgentCli/AgentCli.csproj --configuration Release --no-build --output ./tool-nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}
          dotnet pack TestAutomation/McpServer/McpServer.csproj --configuration Release --no-build --output ./tool-nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}
          dotnet pack TestAutomation/SiteAuditCli/SiteAuditCli.csproj --configuration Release --no-build --output ./tool-nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Validate package contents
        shell: pwsh
        run: ./eng/Validate-NuGetPackages.ps1 -PackageDirectory ./nupkgs -Version $env:PACKAGE_VERSION

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg

      - name: Upload tool packages
        uses: actions/upload-artifact@v7
        with:
          name: tool-nupkgs
          path: ./tool-nupkgs/*.nupkg
