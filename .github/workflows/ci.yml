name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            framework: net48
            name: Windows (Full Suite + FlaUI Live Tests)
            run-flaui: true
          - os: ubuntu-latest
            framework: net8.0
            name: Linux (Cross-Platform Core & Web Suite)
            run-flaui: false
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # On Windows, build the full solution (which produces WinFormsApp.exe needed by live FlaUI tests).
      - name: Build Solution (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          dotnet restore AutomationSandbox.sln
          dotnet build AutomationSandbox.sln --configuration Debug --no-restore

      # On Linux, build ScenarioRunner.csproj directly (only restores and builds cross-platform libraries).
      - name: Build Test Project (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet restore TestAutomation/ScenarioRunner/ScenarioRunner.csproj
          dotnet build TestAutomation/ScenarioRunner/ScenarioRunner.csproj --configuration Debug --framework net8.0 --no-restore

      # PlaywrightLiveExplorerTests launch real headless Chromium; a clean runner has no
      # browsers cached, so download them once (the script ships in the build output).
      - name: Install Playwright Chromium (one-time browser download for live web tests)
        shell: pwsh
        run: pwsh ./TestAutomation/ScenarioRunner/bin/Debug/${{ matrix.framework }}/playwright.ps1 install chromium

      - name: Run tests with Code Coverage
        env:
          # Optional: if these repo secrets are unset, GitHub substitutes an empty
          # string and LlmHealingEvaluationTests skips itself - no error either way.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Optional cost control: set these as repo Variables (not Secrets - not
          # sensitive) to override the hardcoded model defaults, e.g. to a cheaper
          # tier than ClaudeHealingProvider's default (claude-opus-5). Unset falls
          # back to each provider's own default.
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SELF_HEALING_REPORT_PATH: ${{ github.workspace }}/TestAutomation/ScenarioRunner/TestResults/healing-report.json
          SELF_HEALING_REPORT_HTML_PATH: ${{ github.workspace }}/TestAutomation/ScenarioRunner/TestResults/healing-report.html
        run: dotnet test TestAutomation/ScenarioRunner/ScenarioRunner.csproj --configuration Debug --framework ${{ matrix.framework }} --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results-${{ matrix.framework }}.trx" --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestAutomation/ScenarioRunner/TestResults/test-results-*.trx

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-${{ matrix.os }}
          path: TestAutomation/ScenarioRunner/TestResults/**/coverage.cobertura.xml

      - name: Upload self-healing report
        if: always() && matrix.run-flaui
        uses: actions/upload-artifact@v7
        with:
          name: self-healing-report
          path: |
            TestAutomation/ScenarioRunner/TestResults/healing-report.json
            TestAutomation/ScenarioRunner/TestResults/healing-report.html
          if-no-files-found: ignore

  build-and-test:
    name: build-and-test
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify matrix results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Matrix test execution failed: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All matrix test jobs passed."

