name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore AutomationSandbox.sln

      - name: Build (Debug - WinFormsApp.exe path used by ScenarioRunner tests)
        run: dotnet build AutomationSandbox.sln --configuration Debug --no-restore

      - name: Run tests with Code Coverage (Discovery + SelfHealing + live FlaUI/UIA scenarios + LLM comparison)
        env:
          # Optional: if these repo secrets are unset, GitHub substitutes an empty
          # string and LlmHealingEvaluationTests skips itself - no error either way.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: dotnet test TestAutomation/ScenarioRunner/ScenarioRunner.csproj --configuration Debug --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestAutomation/ScenarioRunner/TestResults/test-results.trx

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: TestAutomation/ScenarioRunner/TestResults/**/coverage.cobertura.xml
