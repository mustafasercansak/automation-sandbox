name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            framework: net48
            name: Windows (Full Suite + FlaUI Live Tests)
            coverage-label: Windows net48
            coverage-note: Includes the net48-only Discovery assembly and FlaUI live UIA paths.
            run-flaui: true
            audit-target: AutomationSandbox.sln
          - os: ubuntu-latest
            framework: net8.0
            name: Linux (Cross-Platform Core & Web Suite)
            coverage-label: Linux net8.0
            coverage-note: Discovery and FlaUI live UIA paths are absent by design because they are net48/Windows-only.
            run-flaui: false
            audit-target: TestAutomation/ScenarioRunner/ScenarioRunner.csproj
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # On Windows, build the full solution (which produces WinFormsApp.exe needed by live FlaUI tests).
      - name: Build Solution (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          dotnet restore AutomationSandbox.sln
          dotnet build AutomationSandbox.sln --configuration Debug --no-restore

      # On Linux, build ScenarioRunner.csproj directly (only restores and builds cross-platform libraries).
      - name: Build Test Project (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet restore TestAutomation/ScenarioRunner/ScenarioRunner.csproj
          dotnet build TestAutomation/ScenarioRunner/ScenarioRunner.csproj --configuration Debug --framework net8.0 --no-restore

      # Package security audit (#223): reports every vulnerable and outdated package to
      # the step summary. This is visibility only - the actual merge gate is NuGetAudit
      # in Directory.Build.props, which fails restore above on a High/Critical advisory.
      - name: Audit package vulnerabilities and outdated versions (${{ matrix.coverage-label }})
        if: always()
        shell: pwsh
        run: |
          dotnet list ${{ matrix.audit-target }} package --vulnerable --include-transitive --format json |
            Out-File -FilePath vulnerable-report.json -Encoding utf8
          dotnet list ${{ matrix.audit-target }} package --outdated --format json |
            Out-File -FilePath outdated-report.json -Encoding utf8
          ./.github/scripts/write-security-audit-summary.ps1 `
            -VulnerableReportPath vulnerable-report.json `
            -OutdatedReportPath outdated-report.json `
            -LegLabel '${{ matrix.coverage-label }}'

      # PlaywrightLiveExplorerTests launch real headless Chromium; a clean runner has no
      # browsers cached, so download them once (the script ships in the build output).
      - name: Install Playwright Chromium (one-time browser download for live web tests)
        shell: pwsh
        run: pwsh ./TestAutomation/ScenarioRunner/bin/Debug/${{ matrix.framework }}/playwright.ps1 install chromium

      - name: Run tests with Code Coverage
        env:
          # Optional: if these repo secrets are unset, GitHub substitutes an empty
          # string and LlmHealingEvaluationTests skips itself - no error either way.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Optional cost control: set these as repo Variables (not Secrets - not
          # sensitive) to override the hardcoded model defaults, e.g. to a cheaper
          # tier than ClaudeHealingProvider's default (claude-opus-5). Unset falls
          # back to each provider's own default.
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SELF_HEALING_REPORT_PATH: ${{ github.workspace }}/TestAutomation/ScenarioRunner/TestResults/healing-report.json
          SELF_HEALING_REPORT_HTML_PATH: ${{ github.workspace }}/TestAutomation/ScenarioRunner/TestResults/healing-report.html
        run: dotnet test TestAutomation/ScenarioRunner/ScenarioRunner.csproj --configuration Debug --framework ${{ matrix.framework }} --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results-${{ matrix.framework }}.trx" --logger "console;verbosity=normal"

      - name: Summarize code coverage for ${{ matrix.coverage-label }}
        if: always()
        shell: pwsh
        run: |
          ./.github/scripts/write-coverage-summary.ps1 `
            -CoverageSearchPath ./TestAutomation/ScenarioRunner/TestResults `
            -LegLabel '${{ matrix.coverage-label }}' `
            -PlatformNote '${{ matrix.coverage-note }}'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestAutomation/ScenarioRunner/TestResults/test-results-*.trx

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-${{ matrix.os }}
          path: TestAutomation/ScenarioRunner/TestResults/**/coverage.cobertura.xml

      - name: Upload self-healing report
        if: always() && matrix.run-flaui
        uses: actions/upload-artifact@v7
        with:
          name: self-healing-report
          path: |
            TestAutomation/ScenarioRunner/TestResults/healing-report.json
            TestAutomation/ScenarioRunner/TestResults/healing-report.html
          if-no-files-found: ignore

  nuget-consumer:
    name: NuGet Consumer Sample
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore, build, and run published-package sample
        shell: pwsh
        run: ./samples/HeuristicHealingQuickstart/verify.ps1

  playwright-sample:
    name: Playwright End-to-End Sample
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # Build once so the generated playwright.ps1 install script exists in the sample's
      # own build output before verify.ps1 runs it via `dotnet run`.
      - name: Build sample
        run: dotnet build samples/PlaywrightEndToEndQuickstart --configuration Debug

      - name: Install Playwright Chromium (one-time browser download for the sample's live run)
        shell: pwsh
        run: pwsh ./samples/PlaywrightEndToEndQuickstart/bin/Debug/net8.0/playwright.ps1 install chromium

      - name: Run sample verification
        shell: pwsh
        run: ./samples/PlaywrightEndToEndQuickstart/verify.ps1

  calibration-cli:
    name: Calibration CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Run calibration CLI verification
        shell: pwsh
        run: ./samples/CalibrationCli/verify.ps1

  docs-build-preview:
    name: Docs Build & Link Integrity Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll & Plugins
        run: gem install jekyll kramdown jekyll-relative-links

      - name: Build site with Jekyll
        run: |
          jekyll build --source . --destination ./_site
          if [ ! -f "./_site/index.html" ]; then
            echo "::error::FATAL: ./_site/index.html was not generated!"
            exit 1
          fi
          echo "Verified: ./_site/index.html generated successfully."

  build-and-test:
    name: build-and-test
    needs: [test, nuget-consumer, calibration-cli, docs-build-preview]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify matrix results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Matrix test execution failed: ${{ needs.test.result }}"
            exit 1
          fi
          if [ "${{ needs.nuget-consumer.result }}" != "success" ]; then
            echo "NuGet consumer verification failed: ${{ needs.nuget-consumer.result }}"
            exit 1
          fi
          if [ "${{ needs.calibration-cli.result }}" != "success" ]; then
            echo "Calibration CLI verification failed: ${{ needs.calibration-cli.result }}"
            exit 1
          fi
          if [ "${{ needs.docs-build-preview.result }}" != "success" ]; then
            echo "Docs build preview verification failed: ${{ needs.docs-build-preview.result }}"
            exit 1
          fi
          echo "All matrix test jobs, NuGet consumer, Calibration CLI, and docs build verification passed."

