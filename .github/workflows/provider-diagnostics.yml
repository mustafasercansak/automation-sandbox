name: LLM Provider Diagnostics

# Answers two questions the consensus nightly cannot: is a provider's credential still valid,
# and which model ids may it be asked for. Most providers expose a /models endpoint; Cloudflare's
# account-scoped model-search endpoint can return the equivalent OpenRouter-shaped catalog.
#
# Run this by hand whenever a provider goes quiet in the nightly. Free tiers lapse, get retired
# (#44) and rename their models - the nightly reports "HTTP 400: Model not found", and this
# workflow reports what the valid names are.
#
# Probing from CI rather than a laptop is deliberate: the keys live as repository secrets, so a
# local probe either has no key or uses a different one, and an answer that is correct locally
# can still be wrong here.
#
# Only HTTP status codes and model ids are ever written out. No step echoes a key.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe configured provider endpoints
    runs-on: ubuntu-latest

    steps:
      - name: Probe provider model endpoints
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail

          # Everything is teed so the same table reaches the run log as well as the job
          # summary. GitHub does not expose step summaries over the REST API, so a
          # summary-only report can be read in a browser and nowhere else - which made the
          # first diagnostics run impossible to inspect from the CLI.
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"

          {
            echo "## 🔌 LLM Provider Diagnostics"
            echo
            echo "Status of each provider's models endpoint, and the model ids it will accept."
            echo "Set the repository **variables** (\`GROK_MODEL\`, \`KIMI_MODEL\`, \`KIMI_ENDPOINT\`, …) from what is listed here."
            echo
          } | tee -a "$SUMMARY"

          # $1 label, $2 url, $3 key, $4 auth style (bearer|x-goog|x-api-key)
          probe() {
            local label="$1" url="$2" key="$3" style="$4"

            if [ -z "$key" ]; then
              printf '| `%s` | _no key configured_ | – | – |\n' "$label" | tee -a "$SUMMARY"
              return
            fi
            if [ -z "$url" ]; then
              printf '| `%s` | _endpoint configuration missing_ | – | – |\n' "$label" | tee -a "$SUMMARY"
              return
            fi

            local body code
            case "$style" in
              bearer)    body=$(curl -sS -m 30 -w '\n%{http_code}' "$url" -H "Authorization: Bearer $key" 2>/dev/null) ;;
              x-goog)    body=$(curl -sS -m 30 -w '\n%{http_code}' "$url" -H "x-goog-api-key: $key" 2>/dev/null) ;;
              x-api-key) body=$(curl -sS -m 30 -w '\n%{http_code}' "$url" -H "x-api-key: $key" -H 'anthropic-version: 2023-06-01' 2>/dev/null) ;;
            esac

            code=$(printf '%s' "$body" | tail -n1)
            body=$(printf '%s' "$body" | sed '$d')

            local ids
            # Both shapes appear in the wild: OpenAI-compatible {"data":[{"id":…}]} and
            # Gemini's {"models":[{"name":…}]}. Take whichever is present.
            ids=$(printf '%s' "$body" | jq -r '[(.data[]?.id), (.models[]?.name)] | map(select(. != null)) | join(", ")' 2>/dev/null)

            if [ -z "$ids" ] || [ "$ids" = "null" ]; then
              # No model list means the call did not succeed; surface the provider's own message
              # rather than an empty cell, truncated so a long error cannot swamp the summary.
              ids=$(printf '%s' "$body" | tr '\n' ' ' | cut -c1-200)
              ids="_${ids:-no response}_"
            fi

            printf '| `%s` | %s | `%s` | %s |\n' "$label" "$code" "$url" "$ids" | tee -a "$SUMMARY"
          }

          {
            echo "| Provider | HTTP | Endpoint | Models / Error |"
            echo "| :--- | :---: | :--- | :--- |"
          } | tee -a "$SUMMARY"

          probe "Grok"        "https://api.x.ai/v1/models"                                    "${GROK_API_KEY:-}"      bearer
          # Groq, not Grok - unrelated company, one letter apart, separate key.
          probe "Groq"        "https://api.groq.com/openai/v1/models"                         "${GROQ_API_KEY:-}"      bearer
          probe "OpenRouter"  "https://openrouter.ai/api/v1/models"                           "${OPENROUTER_API_KEY:-}" bearer
          cloudflare_models_url=""
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            # format=openrouter is required, not cosmetic: Cloudflare's native shape is
            # {"result":[{"name":"@cf/..."}]}, and the extractor above reads .data[].id /
            # .models[].name, so the ids would be invisible without it. It also limits the
            # listing to chat-completion models on its own.
            #
            # No task filter. Cloudflare matches task against its display name ("Text
            # Generation"), so the literal "text-generation" matched nothing and the probe
            # answered 200 with {"data":[]} - a valid credential reporting an empty catalog,
            # which reads exactly like a permissions problem. See #107.
            cloudflare_models_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/models/search?format=openrouter&per_page=100"
          fi
          probe "Cloudflare"  "$cloudflare_models_url"                                      "${CLOUDFLARE_API_TOKEN:-}" bearer
          # Moonshot runs separate regions with separate accounts. Probing both in one run is
          # what distinguishes "key belongs to the other region" from "key is invalid" - the
          # nightly's HTTP 401 alone cannot tell those apart.
          # #116. Mistral is OpenAI-compatible; this probe is also what verifies the base URL the
          # factory builds on, before any provider is constructed against an assumed endpoint.
          probe "Mistral"     "https://api.mistral.ai/v1/models"                              "${MISTRAL_API_KEY:-}"   bearer
          probe "Kimi (.ai)"  "https://api.moonshot.ai/v1/models"                             "${KIMI_API_KEY:-}"      bearer
          probe "Kimi (.cn)"  "https://api.moonshot.cn/v1/models"                             "${KIMI_API_KEY:-}"      bearer
          probe "OpenAI"      "https://api.openai.com/v1/models"                              "${OPENAI_API_KEY:-}"    bearer
          probe "Gemini"      "https://generativelanguage.googleapis.com/v1beta/models"       "${GEMINI_API_KEY:-}"    x-goog
          probe "Claude"      "https://api.anthropic.com/v1/models"                           "${ANTHROPIC_API_KEY:-}" x-api-key
          # Ollama's hosted service, if a key is configured. Distinct from OllamaHealingProvider,
          # which targets a local daemon on localhost:11434 and cannot work on an ephemeral runner.
          # If this answers 200 it is reachable as an OpenAI-compatible endpoint via
          # OpenAiHealingProvider with a name of its own - no new provider class needed.
          probe "Ollama Cloud" "https://ollama.com/v1/models"                                 "${OLLAMA_CLOUD_API_KEY:-}" bearer

          {
            echo
            echo "**Reading this:** \`200\` with model ids means the credential works and those names are valid."
            echo "\`401\`/\`403\` is an authentication problem, not a model problem."
            echo "For Kimi, one region returning \`200\` while the other returns \`401\` means the key is fine and \`KIMI_ENDPOINT\` needs to point at the region that answered."
          } | tee -a "$SUMMARY"
