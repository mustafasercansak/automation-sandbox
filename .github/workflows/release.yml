name: Release Preview Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer package version (leave empty to use Directory.Build.props)'
        required: false
        default: ''
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        required: true
        default: true
        type: boolean
      dry_run:
        description: 'Validate and pack all 7 packages without publishing GitHub Release'
        required: false
        default: false
        type: boolean
      publish_to_nuget:
        description: 'Also push packages to nuget.org via Trusted Publishing (OIDC, no stored API key)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Package Version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'.Trim()
          if (-not $version) {
            $props = Get-Content Directory.Build.props -Raw
            if ($props -match '<Version>(?<v>[^<]+)</Version>') {
              $version = $Matches['v'].Trim()
            } else {
              throw 'Could not extract <Version> from Directory.Build.props'
            }
          }
          Write-Host "Resolved package version: $version"
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "TAG_NAME=v$version" >> $env:GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore AutomationSandbox.sln

      - name: Build Release
        run: dotnet build AutomationSandbox.sln --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Pack UiModel
        run: dotnet pack TestAutomation/UiModel/UiModel.csproj --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack SelfHealing
        run: dotnet pack TestAutomation/SelfHealing/SelfHealing.csproj --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack LlmHealing
        run: dotnet pack TestAutomation/LlmHealing/LlmHealing.csproj --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack Discovery
        run: dotnet pack TestAutomation/Discovery/Discovery.csproj --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack WebDiscovery
        run: dotnet pack TestAutomation/WebDiscovery/WebDiscovery.csproj --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack IntentAutomation
        run: dotnet pack TestAutomation/IntentAutomation/IntentAutomation.csproj --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Pack PlaywrightLiveExploration
        run: dotnet pack TestAutomation/PlaywrightLiveExploration/PlaywrightLiveExploration.csproj --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ env.PACKAGE_VERSION }}

      # SBOM (#274): one CycloneDX JSON BOM per published package, generated from the
      # Release dependency graph so consumers can audit the full transitive closure
      # independent of nuget.org metadata. CycloneDX 6.x runs on the .NET 10 runtime,
      # which the setup-dotnet step above installs. No -tfm filter: the tool aggregates
      # every target framework of a project and deduplicates packages shared across them.
      - name: Generate SBOMs (CycloneDX)
        shell: pwsh
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          New-Item -ItemType Directory -Path ./sbom -Force | Out-Null
          $projects = @(
            'UiModel',
            'SelfHealing',
            'LlmHealing',
            'Discovery',
            'WebDiscovery',
            'IntentAutomation',
            'PlaywrightLiveExploration'
          )
          foreach ($name in $projects) {
            dotnet-CycloneDX "TestAutomation/$name/$name.csproj" `
              --output ./sbom --output-format json --filename "$name.bom.json" `
              --configuration Release --include-project-references --set-type Library
            if ($LASTEXITCODE -ne 0) { throw "CycloneDX SBOM generation failed for $name" }
          }

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: release-sboms
          path: ./sbom/*.json

      - name: Validate package contents
        shell: pwsh
        run: ./eng/Validate-NuGetPackages.ps1 -PackageDirectory ./nupkgs -Version $env:PACKAGE_VERSION

      # always(): when validation fails, the produced packages are exactly what needs
      # inspecting, so the artifact must survive a failed run.
      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-nupkgs
          path: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg

      - name: Validate and write release notes
        shell: pwsh
        run: |
          $notesCandidates = @(
            "docs/release-notes/$env:TAG_NAME.md",
            "docs/release-notes/$env:PACKAGE_VERSION.md"
          )
          $notesPath = $notesCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1

          if (-not $notesPath) {
            throw "Release notes file not found for version $env:PACKAGE_VERSION. Expected at docs/release-notes/$env:TAG_NAME.md or docs/release-notes/$env:PACKAGE_VERSION.md."
          }

          $rawNotes = Get-Content -LiteralPath $notesPath -Raw
          if ([string]::IsNullOrWhiteSpace($rawNotes)) {
            throw "Release notes file $notesPath is empty."
          }

          $nugetLine = if ("${{ inputs.publish_to_nuget }}" -eq "true") {
            "They are also pushed to nuget.org via Trusted Publishing."
          } else {
            "It does not push to nuget.org or GitHub Packages."
          }

          $notes = $rawNotes.Replace('__TAG__', $env:TAG_NAME).Replace('__NUGET_PUBLISH_LINE__', $nugetLine)
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          Write-Host "Prepared release notes from $notesPath (length: $($notes.Length) characters)."

      - name: Check for existing release
        if: ${{ !inputs.dry_run }}
        id: check_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh release view` exits non-zero when the release does not exist - the normal
          # case for a first release. The GitHub pwsh shell wrapper ends every step with
          # `exit $LASTEXITCODE`, so that expected non-zero code would otherwise fail the
          # step. Capture the code, then reset and exit clean.
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          & gh release view $env:TAG_NAME *> $null
          $exists = if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' }
          "exists=$exists" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $global:LASTEXITCODE = 0
          exit 0

      # Re-running a version that was already released (for example to push to nuget.org
      # after verifying the GitHub Release) must not fail here - `gh release create` has
      # no upsert mode, so creation is skipped once the release already exists.
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run && steps.check_release.outputs.exists == 'false' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $args = @(
            "release", "create", "$env:TAG_NAME",
            "./nupkgs/*.nupkg",
            "./nupkgs/*.snupkg",
            "./sbom/*.json",
            "--target", "${{ github.sha }}",
            "--title", "$env:TAG_NAME",
            "--notes-file", "release-notes.md"
          )

          if ("${{ inputs.prerelease }}" -eq "true") {
            $args += "--prerelease"
          }

          gh @args

      # The temporary API key nuget.org issues here is valid for 1 hour, so this login
      # step runs immediately before the push rather than earlier in the job.
      - name: NuGet login (OIDC -> temporary API key)
        if: ${{ inputs.publish_to_nuget && !inputs.dry_run }}
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to nuget.org
        if: ${{ inputs.publish_to_nuget && !inputs.dry_run }}
        shell: pwsh
        run: |
          Get-ChildItem ./nupkgs/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

      # Post-publish consumer verification (#336): restore the sample EXACTLY as an
      # external consumer would — clean package dir, nuget.org only, no cache — against
      # the version just pushed. This is the real "the published artifact works" gate;
      # it replaces the old per-PR nuget-consumer job, which could not run before publish.
      - name: Verify the published package for a consumer
        if: ${{ inputs.publish_to_nuget && !inputs.dry_run }}
        shell: pwsh
        run: ./samples/HeuristicHealingQuickstart/verify-published.ps1 -Version $env:PACKAGE_VERSION

      # Version bump is a workflow output, not a manual pre-req (#336): once the exact
      # version is confirmed live on nuget.org, bump the SSoT and the sample pin to it
      # and open the follow-up PR. Per-PR CI no longer chokes on this because the
      # exact-version restore no longer runs there.
      - name: Bump SSoT version and sample pin, open the follow-up PR
        if: ${{ inputs.publish_to_nuget && !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:PACKAGE_VERSION
          $props = 'Directory.Build.props'
          $sample = 'samples/HeuristicHealingQuickstart/HeuristicHealingQuickstart.csproj'

          $propsText = Get-Content $props -Raw
          if ($propsText -match '<Version>(?<v>[^<]+)</Version>' -and $Matches['v'].Trim() -eq $v) {
            Write-Host "Directory.Build.props <Version> is already $v; nothing to bump."
            exit 0
          }

          $newProps  = ($propsText -replace '<Version>[^<]+</Version>', "<Version>$v</Version>")
          $newSample = ((Get-Content $sample -Raw) -replace '(<PackageReference\s+Include="AutomationSandbox\.SelfHealing"\s+Version=")[^"]+(")', ('${1}' + $v + '${2}'))
          # Match the file's own trailing-newline convention rather than always stripping it
          # (-NoNewline did, producing a spurious "no newline at EOF" churn every release).
          Set-Content $props  -Value $newProps  -NoNewline:(-not $propsText.EndsWith("`n"))
          Set-Content $sample -Value $newSample -NoNewline:(-not ((Get-Content $sample -Raw).EndsWith("`n")))

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $branch = "release/ssot-bump-$v"
          git checkout -B $branch
          git add $props $sample
          git commit -m "chore(release): bump SSoT version to $v after publish"
          # Plain --force (not --force-with-lease): a fresh local branch has no remote-tracking
          # ref for the lease to check, and this branch is entirely workflow-owned, so a lease
          # buys nothing. --force also lets a re-run overwrite a branch a prior failed run left.
          git push origin $branch --force

          $body = "Automated follow-up from the release workflow: version $v is published to nuget.org, so Directory.Build.props <Version> and the HeuristicHealingQuickstart package pin are bumped to match. Safe to merge once CI is green - the exact-version consumer restore already ran in the release job (verify-published.ps1), so nothing here waits on nuget.org indexing."
          $existing = gh pr list --head $branch --state open --json url --jq '.[0].url // empty'
          if ($existing) {
            Write-Host "Bump PR already open: $existing"
            "SSoT-bump PR (already open): $existing" >> $env:GITHUB_STEP_SUMMARY
          } else {
            $url = gh pr create --base main --head $branch --label packaging --title "chore(release): bump SSoT version to $v" --body $body
            if ($LASTEXITCODE -ne 0 -or -not $url) {
              throw "gh pr create failed for $branch (exit $LASTEXITCODE). The version is published; open the SSoT-bump PR by hand from branch '$branch'."
            }
            Write-Host "Opened bump PR: $url"
            "SSoT-bump PR: $url" >> $env:GITHUB_STEP_SUMMARY
          }
