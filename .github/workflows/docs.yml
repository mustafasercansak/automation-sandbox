name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.md'
      - '_config.yml'
      - '_layouts/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Resolve Package Version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $ver = $props.Project.PropertyGroup.Version
          if (-not $ver) {
            throw "Could not resolve <Version> from Directory.Build.props"
          }
          Write-Host "Resolved package version: $ver"
          "PACKAGE_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Install Jekyll & Plugins
        run: |
          gem install jekyll kramdown jekyll-relative-links

      - name: Build site with Jekyll
        run: |
          jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --source . --destination ./_site

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
