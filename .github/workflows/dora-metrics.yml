name: DORA Metrics & Engineering Reliability

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  calculate-dora:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate DORA & Reliability Metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          scripts/calculate_dora.ps1 -Days 30 -Format markdown -Output dora-report.md
          Get-Content dora-report.md >> $env:GITHUB_STEP_SUMMARY

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: dora-report
          path: dora-report.md
          if-no-files-found: error
