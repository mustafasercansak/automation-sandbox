title: Automation Sandbox
description: Explainable self-healing UI test automation engine.
repository: mustafasercansak/automation-sandbox
markdown: kramdown

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - bin
  - obj
  - TestAutomation
  - WinFormsApp
  - WpfApp
  - samples
  # Per-package NuGet READMEs (#338): embedded in the .nupkg files, not pages on the docs
  # site. They deliberately carry no Jekyll front matter (nuget.org would render it), so
  # Jekyll would otherwise copy them out as raw .md. The trailing slash matters: a bare
  # "docs/nuget" here silently swallows docs/nuget-packaging.md too (its relative path
  # starts with the same prefix), 404ing that page on the live site with no build error.
  - docs/nuget/
  - docs/blog/demo-storyboard.md
  - docs/blog/distribution-kit.md
  - docs/blog/gen-demo-gif.py
  # Non-.NET reference example (#522): its README.md also carries no Jekyll front
  # matter, for the same reason as the docs/nuget/ READMEs above - without this
  # exclusion Jekyll would copy it out as an unstyled raw .md on the next docs
  # deploy for any unrelated reason, since docs.yml builds the whole repo from
  # scratch every time. docs/schemas/ui-element-info.schema.json is NOT excluded
  # here: it's a .json file, not markdown, so Jekyll copies it as a static asset
  # regardless of front matter, and it needs to stay fetchable at its published URL.
  - examples/
